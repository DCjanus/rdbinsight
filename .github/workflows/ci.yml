name: CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify version consistency (tag/Cargo.toml/CHANGELOG)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: ./.github/actions/verify-version-consistency

      - name: Install nightly Rust toolchain (rustfmt + llvm-tools-preview)
        id: toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Run cargo fmt --check (nightly)
        run: cargo +nightly fmt --all -- --check

      - name: Run cargo clippy (nightly)
        run: cargo +nightly clippy --all -- -D warnings

  coverage:
    name: Coverage (llvm-cov + nextest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install nightly Rust toolchain (llvm-tools-preview)
        id: toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable sccache for Rust builds
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report (cargo llvm-cov + nextest)
        run: |
          CARGO_LLVM_COV_SETUP=yes \
          cargo +nightly llvm-cov nextest \
            --all-features --workspace \
            --codecov --output-path codecov.json

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: codecov.json
          fail_ci_if_error: true

      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH} --show-stats

  parser-benchmark:
    name: Parser Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RDBINSIGHT_BENCH_GENERATED_BYTES: "67108864"
      RDBINSIGHT_BENCH_SAMPLE_SIZE: "10"
      RDBINSIGHT_BENCH_WARM_UP_SECS: "1"
      RDBINSIGHT_BENCH_MEASUREMENT_SECS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable sccache for Rust builds
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Benchmark base branch
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git worktree add ../rdbinsight-base "$BASE_SHA"
          if [ ! -f ../rdbinsight-base/benches/parser.rs ]; then
            echo "Base branch has no parser benchmark; skipping base baseline." | tee parser-benchmark-base.txt
            exit 0
          fi
          (
            cd ../rdbinsight-base
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
              cargo +nightly bench --bench parser -- --noplot --save-baseline base
          ) | tee parser-benchmark-base.txt

      - name: Benchmark current commit
        run: |
          set -euo pipefail
          if [ -d target/criterion/parser ]; then
            cargo +nightly bench --bench parser -- --noplot --baseline base | tee parser-benchmark-current.txt
          else
            cargo +nightly bench --bench parser -- --noplot | tee parser-benchmark-current.txt
          fi

      - name: Publish benchmark summary
        if: always()
        run: |
          {
            echo "## Parser benchmark"
            echo
            echo "- Input: generated ${RDBINSIGHT_BENCH_GENERATED_BYTES} byte synthetic string-record RDB unless RDBINSIGHT_BENCH_RDB is set."
            echo "- Benchmark excludes disk I/O; RDB bytes are prepared before timing starts."
            echo
            if [ -f parser-benchmark-base.txt ]; then
              echo "### Base"
              echo '```text'
              cat parser-benchmark-base.txt
              echo '```'
              echo
            fi
            echo "### Current"
            echo '```text'
            cat parser-benchmark-current.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-benchmark
          path: |
            parser-benchmark-*.txt
            target/criterion

  docker-builds:
    name: Docker Build (${{ matrix.name }})
    needs: [lint, coverage]
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            platform: linux/amd64
            runs-on: ubuntu-latest
          - name: arm64
            platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase)
        id: vars
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}

      - name: Build and push (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.vars.outputs.image }},push-by-digest=true,push=true

      - name: Persist image digest
        run: |
          echo "PLATFORM=${{ matrix.platform }}" > digest.env
          echo "DIGEST=${{ steps.build.outputs.digest }}" >> digest.env
        shell: bash

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: digest.env

  docker-merge:
    name: Docker push
    runs-on: ubuntu-latest
    needs: [docker-builds]
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase)
        id: vars
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Download digest (amd64)
        uses: actions/download-artifact@v4
        with:
          name: digest-amd64
          path: digests/amd64

      - name: Download digest (arm64)
        uses: actions/download-artifact@v4
        with:
          name: digest-arm64
          path: digests/arm64

      - name: Docker metadata (recompute tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          source digests/amd64/digest.env
          AMD_DIGEST="$DIGEST"
          source digests/arm64/digest.env
          ARM_DIGEST="$DIGEST"
          # docker/metadata-action returns newline-separated tags
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "Merging $tag with $IMAGE@${AMD_DIGEST} and $IMAGE@${ARM_DIGEST}"
              docker buildx imagetools create -t "$tag" \
                "$IMAGE@${AMD_DIGEST}" \
                "$IMAGE@${ARM_DIGEST}"
            fi
          done <<< "$TAGS"
