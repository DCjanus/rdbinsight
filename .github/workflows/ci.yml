name: CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify version consistency (tag/Cargo.toml/CHANGELOG)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: ./.github/actions/verify-version-consistency

      - name: Install nightly Rust toolchain (rustfmt + llvm-tools-preview)
        id: toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Run cargo fmt --check (nightly)
        run: cargo +nightly fmt --all -- --check

      - name: Run cargo clippy (nightly)
        run: cargo +nightly clippy --all -- -D warnings

  coverage:
    name: Coverage (llvm-cov + nextest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install nightly Rust toolchain (llvm-tools-preview)
        id: toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable sccache for Rust builds
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report (cargo llvm-cov + nextest)
        run: |
          CARGO_LLVM_COV_SETUP=yes \
          cargo +nightly llvm-cov nextest \
            --all-features --workspace \
            --codecov --output-path codecov.json

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: codecov.json
          fail_ci_if_error: true

      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH} --show-stats

  parser-benchmark:
    name: Parser Benchmark (${{ matrix.shard }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: strings
            profiles: "string,string-int"
          - shard: lists
            profiles: "list,list-ziplist,list-quicklist,list-quicklist2"
          - shard: sets-arrays
            profiles: "set,set-intset,set-listpack,array"
          - shard: hashes-basic
            profiles: "hash,hash-ziplist,hash-listpack"
          - shard: hashes-extra
            profiles: "hash-zipmap,hash-metadata,hash-listpack-ex"
          - shard: zsets
            profiles: "zset,zset2,zset-ziplist,zset-listpack"
          - shard: mixed
            profiles: "mixed"
    env:
      RDBINSIGHT_BENCH_PROFILES: ${{ matrix.profiles }}
      RDBINSIGHT_BENCH_GENERATED_BYTES: "16777216"
      RDBINSIGHT_BENCH_MAX_SLOWDOWN_PERCENT: "30"
      RDBINSIGHT_BENCH_SAMPLE_SIZE: "10"
      RDBINSIGHT_BENCH_WARM_UP_SECS: "1"
      RDBINSIGHT_BENCH_MEASUREMENT_SECS: "3"
      RDBINSIGHT_BENCH_SAMPLING_MODE: "flat"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable sccache for Rust builds
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Install parser benchmark helper dependencies
        run: npm ci --ignore-scripts --prefix .github/actions/parser-benchmark

      - name: Run parser benchmark
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/actions/parser-benchmark/index.js

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parser-benchmark-${{ matrix.shard }}
          path: |
            parser-benchmark-*.txt
            target/criterion-base
            target/criterion-current

  parser-benchmark-summary:
    name: Parser Benchmark Summary
    runs-on: ubuntu-latest
    needs: [parser-benchmark]
    permissions:
      contents: read
    steps:
      - name: Download benchmark artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: parser-benchmark-*
          path: parser-benchmark-artifacts

      - name: Write aggregate benchmark summary
        env:
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const artifactRoot = "parser-benchmark-artifacts";
          const baseRoots = [];
          const currentRoots = [];
          const expectedBenchmarkNames = [
            "parser/parse_rdb/synthetic-array-records-16MiB",
            "parser/parse_rdb/synthetic-hash-listpack-ex-records-16MiB",
            "parser/parse_rdb/synthetic-hash-listpack-records-16MiB",
            "parser/parse_rdb/synthetic-hash-metadata-records-16MiB",
            "parser/parse_rdb/synthetic-hash-records-16MiB",
            "parser/parse_rdb/synthetic-hash-ziplist-records-16MiB",
            "parser/parse_rdb/synthetic-hash-zipmap-records-16MiB",
            "parser/parse_rdb/synthetic-list-quicklist-records-16MiB",
            "parser/parse_rdb/synthetic-list-quicklist2-records-16MiB",
            "parser/parse_rdb/synthetic-list-records-16MiB",
            "parser/parse_rdb/synthetic-list-ziplist-records-16MiB",
            "parser/parse_rdb/synthetic-mixed-raw-types-16MiB",
            "parser/parse_rdb/synthetic-set-intset-records-16MiB",
            "parser/parse_rdb/synthetic-set-listpack-records-16MiB",
            "parser/parse_rdb/synthetic-set-records-16MiB",
            "parser/parse_rdb/synthetic-string-int-records-16MiB",
            "parser/parse_rdb/synthetic-string-records-16MiB",
            "parser/parse_rdb/synthetic-zset-listpack-records-16MiB",
            "parser/parse_rdb/synthetic-zset-records-16MiB",
            "parser/parse_rdb/synthetic-zset-ziplist-records-16MiB",
            "parser/parse_rdb/synthetic-zset2-records-16MiB",
          ];
          const expectedBenchmarkNameSet = new Set(expectedBenchmarkNames);
          const isPullRequest = process.env.EVENT_NAME === "pull_request";

          function fileExists(filePath) {
            return fs.existsSync(filePath);
          }

          function readJson(filePath) {
            return JSON.parse(fs.readFileSync(filePath, "utf8"));
          }

          function walkFiles(dir, basename, out = []) {
            if (!fileExists(dir)) return out;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const entryPath = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walkFiles(entryPath, basename, out);
              } else if (entry.name === basename) {
                out.push(entryPath);
              }
            }
            return out;
          }

          function collectCriterionRoots(dir) {
            if (!fileExists(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const entryPath = path.join(dir, entry.name);
              if (!entry.isDirectory()) continue;
              if (entryPath.endsWith(`${path.sep}target${path.sep}criterion-base`)) {
                baseRoots.push(entryPath);
              } else if (entryPath.endsWith(`${path.sep}target${path.sep}criterion-current`)) {
                currentRoots.push(entryPath);
              }
              collectCriterionRoots(entryPath);
            }
          }

          function benchmarkName(root, estimatesPath) {
            return path.relative(root, estimatesPath).split(path.sep).slice(0, -2).join("/");
          }

          function median(filePath) {
            const value = readJson(filePath).median?.point_estimate;
            if (!Number.isFinite(value) || value <= 0) {
              throw new Error(`invalid median estimate in ${filePath}`);
            }
            return value;
          }

          function bytesFor(name) {
            const benchmarkPath = currentRoots
              .map((root) => path.join(root, ...name.split("/"), "new", "benchmark.json"))
              .find(fileExists);
            if (!benchmarkPath) return Number.NaN;
            const value = readJson(benchmarkPath).throughput?.Bytes ?? Number.NaN;
            return Number.isFinite(value) && value > 0 ? value : Number.NaN;
          }

          function cell(value) {
            return String(value)
              .slice(0, 200)
              .replaceAll("\\", "\\\\")
              .replaceAll("|", "\\|")
              .replaceAll("`", "\\`")
              .replaceAll("\r", " ")
              .replaceAll("\n", " ")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;");
          }

          function duration(ns) {
            if (!Number.isFinite(ns)) return "-";
            if (ns < 1_000) return `${ns.toFixed(2)} ns`;
            if (ns < 1_000_000) return `${(ns / 1_000).toFixed(2)} us`;
            if (ns < 1_000_000_000) return `${(ns / 1_000_000).toFixed(2)} ms`;
            return `${(ns / 1_000_000_000).toFixed(2)} s`;
          }

          function throughput(bytes, ns) {
            if (!Number.isFinite(bytes) || !Number.isFinite(ns) || ns <= 0) return "-";
            return `${(bytes / (1024 * 1024) / (ns / 1_000_000_000)).toFixed(2)} MiB/s`;
          }

          function change(currentNs, baseNs) {
            if (!Number.isFinite(currentNs) || !Number.isFinite(baseNs) || baseNs <= 0) return "-";
            const value = (currentNs / baseNs - 1) * 100;
            const prefix = value > 0 ? "+" : "";
            const direction = value > 0 ? "slower" : value < 0 ? "faster" : "same";
            return `${prefix}${value.toFixed(2)}% ${direction}`;
          }

          function shortSha(sha) {
            return (sha || "").slice(0, 7);
          }

          function commitLink(repo, sha) {
            if (!repo || !sha) return "-";
            return `[${cell(shortSha(sha))}](https://github.com/${repo}/commit/${sha})`;
          }

          function runLink(label, runId) {
            return `[${cell(label)}](https://github.com/${process.env.REPO}/actions/runs/${runId})`;
          }

          collectCriterionRoots(artifactRoot);
          if (currentRoots.length === 0) {
            throw new Error("no criterion-current directories found in benchmark artifacts");
          }
          if (isPullRequest && baseRoots.length === 0) {
            throw new Error("no criterion-base directories found in benchmark artifacts");
          }

          const rows = currentRoots
            .flatMap((currentRoot) =>
              walkFiles(currentRoot, "estimates.json")
                .filter((filePath) => filePath.endsWith(`${path.sep}new${path.sep}estimates.json`))
                .flatMap((filePath) => {
                  const name = benchmarkName(currentRoot, filePath);
                  if (!expectedBenchmarkNameSet.has(name)) {
                    console.log(`Skipping unexpected benchmark name: ${name}`);
                    return [];
                  }
                  const basePath = baseRoots
                    .map((baseRoot) => path.join(baseRoot, ...name.split("/"), "base", "estimates.json"))
                    .find(fileExists);
                  const currentNs = median(filePath);
                  const baseNs = basePath ? median(basePath) : Number.NaN;
                  return [{ name, currentNs, baseNs, bytes: bytesFor(name) }];
                }),
            )
            .sort((a, b) => a.name.localeCompare(b.name));

          const foundBenchmarkNameSet = new Set(rows.map((row) => row.name));
          const missingBenchmarkNames = expectedBenchmarkNames.filter(
            (name) => !foundBenchmarkNameSet.has(name),
          );
          if (missingBenchmarkNames.length > 0) {
            throw new Error(`missing expected benchmark rows: ${missingBenchmarkNames.join(", ")}`);
          }

          const missingBaseNames = rows
            .filter((row) => !Number.isFinite(row.baseNs))
            .map((row) => row.name);
          if (isPullRequest && missingBaseNames.length > 0) {
            throw new Error(`missing base benchmark rows: ${missingBaseNames.join(", ")}`);
          }

          const table = [
            "| Benchmark | Base median | Current median | Change | Current throughput |",
            "| --- | ---: | ---: | ---: | ---: |",
            ...rows.map((row) =>
              `| \`${cell(row.name)}\` | ${cell(duration(row.baseNs))} | ${cell(duration(row.currentNs))} | ${cell(change(row.currentNs, row.baseNs))} | ${cell(throughput(row.bytes, row.currentNs))} |`,
            ),
          ].join("\n");

          const summary = [
            "## Parser benchmark",
            "",
            "- Each profile's base and current benchmarks run in the same shard job on the same GitHub runner.",
            `- Base commit: ${commitLink(process.env.BASE_REPO, process.env.BASE_SHA)}; head commit: ${commitLink(process.env.HEAD_REPO, process.env.HEAD_SHA)}.`,
            `- Benchmark workflow: ${runLink(`CI run ${process.env.GITHUB_RUN_ID}`, process.env.GITHUB_RUN_ID)}.`,
            "- Benchmark excludes disk I/O; RDB bytes are prepared before timing starts.",
            "- Positive change means the current PR is slower than the base commit.",
            "- Parser benchmark fails when any comparable profile slows down by more than 30%.",
            "",
            table,
            "",
          ].join("\n");

          fs.writeFileSync("parser-benchmark-summary.md", summary);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE

      - name: Upload aggregate benchmark summary
        uses: actions/upload-artifact@v7
        with:
          name: parser-benchmark-summary
          path: parser-benchmark-summary.md

  docker-builds:
    name: Docker Build (${{ matrix.name }})
    needs: [lint, coverage]
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            platform: linux/amd64
            runs-on: ubuntu-latest
          - name: arm64
            platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase)
        id: vars
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}

      - name: Build and push (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.vars.outputs.image }},push-by-digest=true,push=true

      - name: Persist image digest
        run: |
          echo "PLATFORM=${{ matrix.platform }}" > digest.env
          echo "DIGEST=${{ steps.build.outputs.digest }}" >> digest.env
        shell: bash

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.name }}
          path: digest.env

  docker-merge:
    name: Docker push
    runs-on: ubuntu-latest
    needs: [docker-builds]
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase)
        id: vars
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Download digest (amd64)
        uses: actions/download-artifact@v8
        with:
          name: digest-amd64
          path: digests/amd64

      - name: Download digest (arm64)
        uses: actions/download-artifact@v8
        with:
          name: digest-arm64
          path: digests/arm64

      - name: Docker metadata (recompute tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          source digests/amd64/digest.env
          AMD_DIGEST="$DIGEST"
          source digests/arm64/digest.env
          ARM_DIGEST="$DIGEST"
          # docker/metadata-action returns newline-separated tags
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "Merging $tag with $IMAGE@${AMD_DIGEST} and $IMAGE@${ARM_DIGEST}"
              docker buildx imagetools create -t "$tag" \
                "$IMAGE@${AMD_DIGEST}" \
                "$IMAGE@${ARM_DIGEST}"
            fi
          done <<< "$TAGS"
