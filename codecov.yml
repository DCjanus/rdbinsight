coverage:
  status:
    project:
      default:
        target: 70
    patch: off

ignore:
  - "src/bin/**"
  - "tests/**"
  - "benches/**"
  - "examples/**"
  - "docs/**"

comment:
  layout: "header, diff, flags, components"

github_checks:
  annotations: true 

component_management:
  individual_components:
    - component_id: component_parser
      name: "parser"
      paths:
        - "src/parser/**"
      statuses:
        - type: project
          target: 90
    - component_id: component_source
      name: "source"
      paths:
        - "src/source/**"
      statuses:
        - type: project
          # Keep raising this toward 80 as additional source backends gain end-to-end coverage.
          target: 55
    - component_id: component_report
      name: "report"
      paths:
        - "src/report/**"
      statuses:
        - type: project
          target: 75
