name: Cache comparison (temporary)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: ${{ matrix.cache }} compilation
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cache: [sccache, mbx]
    env:
      SCCACHE_GHA_VERSION: rdbinsight-mbx-comparison-v2
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - name: Set up sccache
        if: matrix.cache == 'sccache'
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Enable sccache
        if: matrix.cache == 'sccache'
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Set up mr boxington
        if: matrix.cache == 'mbx'
        id: mbx
        uses: jdx/mr-boxington-action@9df1d4b18b2147788a7ee7a2c7b84ecf62fd89d3 # v1.5.0
        with:
          version: 1.18.0
          toolchain: nightly
          cache-generation: comparison-objects-v1
          github-cache-mode: objects
          save-on-workflow-dispatch: true

      - name: Record compiler and cache state
        run: |
          rustc +nightly -vV
          if [ "${{ matrix.cache }}" = mbx ]; then
            mbx doctor
            echo "mbx cache hit: ${{ steps.mbx.outputs.cache-hit }}"
          fi

      - name: Build test binaries twice with a fresh target
        shell: bash
        run: |
          set -euo pipefail
          echo '| Phase | Cache | Seconds |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- | ---: |' >> "$GITHUB_STEP_SUMMARY"
          for phase in 1 2; do
            if [ "$phase" = 2 ]; then
              rm -rf target
            fi
            start=$SECONDS
            if [ "${{ matrix.cache }}" = mbx ]; then
              MBX_SUMMARY=full mbx +nightly test --workspace --all-features --no-run --locked
            else
              cargo +nightly test --workspace --all-features --no-run --locked
            fi
            elapsed=$((SECONDS - start))
            echo "phase=$phase cache=${{ matrix.cache }} seconds=$elapsed"
            echo "| $phase | ${{ matrix.cache }} | $elapsed |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "${{ matrix.cache }}" = mbx ]; then
            find target -maxdepth 3 -type d | head -60 || true
          fi

      - name: Report cache stats
        if: always()
        shell: bash
        run: |
          if [ "${{ matrix.cache }}" = mbx ]; then
            mbx stats --json
          else
            "${SCCACHE_PATH}" --show-stats
          fi
