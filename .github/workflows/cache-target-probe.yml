name: Cache target probe (temporary)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      MBX_TARGET_VIEWS: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: jdx/mr-boxington-action@9df1d4b18b2147788a7ee7a2c7b84ecf62fd89d3 # v1.5.0
        with:
          version: 1.18.0
          toolchain: nightly
          cache-generation: target-probe-v1
          save-on-workflow-dispatch: true
      - name: Build and inspect Cargo target
        run: |
          mbx +nightly test --workspace --all-features --no-run --locked
          cargo +nightly metadata --format-version 1 --no-deps | jq -r '.target_directory, .build_directory'
          ls -ld target
          find target -maxdepth 4 -name .fingerprint -type d | head -20
          find target -maxdepth 3 -type d | head -40
