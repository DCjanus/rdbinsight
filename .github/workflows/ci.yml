name: CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify version consistency (tag/Cargo.toml/CHANGELOG)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: ./.github/actions/verify-version-consistency

      - name: Install nightly Rust toolchain (rustfmt + llvm-tools-preview)
        id: toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Run cargo fmt --check (nightly)
        run: cargo +nightly fmt --all -- --check

      - name: Run cargo clippy (nightly)
        run: cargo +nightly clippy --all -- -D warnings

  coverage:
    name: Coverage (llvm-cov + nextest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install nightly Rust toolchain (llvm-tools-preview)
        id: toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable sccache for Rust builds
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report (cargo llvm-cov + nextest)
        run: |
          CARGO_LLVM_COV_SETUP=yes \
          cargo +nightly llvm-cov nextest \
            --all-features --workspace \
            --codecov --output-path codecov.json

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: codecov.json
          fail_ci_if_error: true

      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH} --show-stats

  parser-benchmark:
    name: Parser Benchmark (${{ matrix.shard }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: strings-lists
            profiles: "string,string-int,list,list-ziplist,list-quicklist,list-quicklist2"
          - shard: sets-arrays
            profiles: "set,set-intset,set-listpack,array"
          - shard: hashes
            profiles: "hash,hash-ziplist,hash-listpack,hash-zipmap,hash-metadata,hash-listpack-ex"
          - shard: zsets
            profiles: "zset,zset2,zset-ziplist,zset-listpack"
          - shard: mixed
            profiles: "mixed"
    env:
      RDBINSIGHT_BENCH_PROFILES: ${{ matrix.profiles }}
      RDBINSIGHT_BENCH_GENERATED_BYTES: "16777216"
      RDBINSIGHT_BENCH_MAX_SLOWDOWN_PERCENT: "30"
      RDBINSIGHT_BENCH_SAMPLE_SIZE: "10"
      RDBINSIGHT_BENCH_WARM_UP_SECS: "1"
      RDBINSIGHT_BENCH_MEASUREMENT_SECS: "2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable sccache for Rust builds
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Install parser benchmark helper dependencies
        run: npm ci --ignore-scripts --prefix .github/actions/parser-benchmark

      - name: Run parser benchmark
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/actions/parser-benchmark/index.js

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parser-benchmark-${{ matrix.shard }}
          path: |
            parser-benchmark-*.txt
            target/criterion-base
            target/criterion-current

  docker-builds:
    name: Docker Build (${{ matrix.name }})
    needs: [lint, coverage]
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            platform: linux/amd64
            runs-on: ubuntu-latest
          - name: arm64
            platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase)
        id: vars
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}

      - name: Build and push (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.vars.outputs.image }},push-by-digest=true,push=true

      - name: Persist image digest
        run: |
          echo "PLATFORM=${{ matrix.platform }}" > digest.env
          echo "DIGEST=${{ steps.build.outputs.digest }}" >> digest.env
        shell: bash

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.name }}
          path: digest.env

  docker-merge:
    name: Docker push
    runs-on: ubuntu-latest
    needs: [docker-builds]
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase)
        id: vars
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Download digest (amd64)
        uses: actions/download-artifact@v8
        with:
          name: digest-amd64
          path: digests/amd64

      - name: Download digest (arm64)
        uses: actions/download-artifact@v8
        with:
          name: digest-arm64
          path: digests/arm64

      - name: Docker metadata (recompute tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          source digests/amd64/digest.env
          AMD_DIGEST="$DIGEST"
          source digests/arm64/digest.env
          ARM_DIGEST="$DIGEST"
          # docker/metadata-action returns newline-separated tags
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "Merging $tag with $IMAGE@${AMD_DIGEST} and $IMAGE@${ARM_DIGEST}"
              docker buildx imagetools create -t "$tag" \
                "$IMAGE@${AMD_DIGEST}" \
                "$IMAGE@${ARM_DIGEST}"
            fi
          done <<< "$TAGS"
